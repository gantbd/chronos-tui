name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - name: Check out Chronos TUI
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: chronos-tui
          persist-credentials: false
      - name: Check out Keystone dependency
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: gantbd/keystone
          ref: 2e4faf10ec0a70805aa1db1555f93c77fcf0a1e4
          path: keystone
          persist-credentials: false
      - name: Check out Chronos dependency
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: gantbd/chronos
          ref: 43fdf6f33fa526899639f03cc32e398bcea86010
          path: chronos
          persist-credentials: false
      - name: Check out Daimon dependency
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: gantbd/daimon
          ref: 07caa33d835c634947cc16109d1c999581501835
          path: daimon
          persist-credentials: false
      - name: Check out Moira dependency
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: gantbd/moira
          ref: 92018a832b6e2a0cfcb990f74818723ef2478434
          path: moira
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.95.0 --profile minimal --component clippy,rustfmt
      - name: Install gate prerequisites
        run: brew install tmux
      - name: Fetch locked dependencies
        working-directory: chronos-tui
        run: cargo fetch --locked
      - name: Audit current RustSec advisories
        working-directory: chronos-tui
        run: |
          cargo install cargo-audit --version 0.23.0 --locked
          cargo audit --deny warnings
      - name: Verify workspace
        working-directory: chronos-tui
        run: make check
